<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إطار الصورة</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 420px;
      margin: auto;
      background: #fff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #eee;
      margin-top: 12px;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #111;
      color: #fff;
      text-decoration: none;
    }
    input[type="file"] {
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3>اختر صورتك داخل الفريم</h3>
    <input type="file" id="photoInput" accept="image/*" />
    <canvas id="canvas"></canvas>
    <button class="btn" id="downloadBtn">تحميل الصورة</button>
  </div>

  <script>
    const input = document.getElementById('photoInput');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    const frameImg = new Image();
    frameImg.src = './frame.png';

    let userImg = null;

    function draw() {
      if (!frameImg.complete || !frameImg.naturalWidth) return;

      // ضبط مقاس الـ canvas ليكون مطابق تماماً لأبعاد الفريم (مستطيل أو أي مقاس)
      if (canvas.width !== frameImg.naturalWidth || canvas.height !== frameImg.naturalHeight) {
        canvas.width = frameImg.naturalWidth;
        canvas.height = frameImg.naturalHeight;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (userImg) {
        const scale = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
        const w = userImg.width * scale;
        const h = userImg.height * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        ctx.drawImage(userImg, x, y, w, h);
      }

      ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
    }

    frameImg.onload = draw;

    input.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          userImg = img;
          draw();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'my-event-photo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
