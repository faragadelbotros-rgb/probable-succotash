
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إطار الصورة</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      background: #f4f4f4;
      margin: 0;
      padding: 20px;
    }
    .box {
      max-width: 420px;
      margin: auto;
      background: #fff;
      padding: 16px;
      border-radius: 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    .actions {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .pick-btn {
      flex: 1;
      min-width: 140px;
      padding: 11px 14px;
      font-size: 15px;
      border-radius: 10px;
      border: 1px solid #ccc;
      background: #fafafa;
      color: #111;
      cursor: pointer;
    }
    .hint {
      font-size: 12.5px;
      color: #555;
      margin-top: 10px;
      line-height: 1.5;
    }
    canvas {
      width: 100%;
      height: auto;
      border-radius: 10px;
      background: #eee;
      margin-top: 12px;
      display: block;
    }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 18px;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background: #111;
      color: #fff;
      text-decoration: none;
    }
    input[type="file"] {
      display: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <h3>اختر صورتك داخل الفريم</h3>

    <!-- زر الكاميرا المباشرة -->
    <input type="file" id="cameraInput" accept="image/*" capture="user" />
    <!-- زر اختيار من المعرض -->
    <input type="file" id="galleryInput" accept="image/*" />

    <div class="actions">
      <button type="button" class="pick-btn" id="cameraBtn">📷 التقاط صورة</button>
      <button type="button" class="pick-btn" id="galleryBtn">🖼️ من المعرض</button>
    </div>

    <div class="hint">
      لو الكاميرا لم تفتح من داخل تطبيق (مثل واتساب أو فيسبوك)، افتح الرابط في <b>Chrome</b> أو <b>Safari</b> أو صوّر بكاميرا الموبايل واخترها من <b>المعرض</b>.
    </div>

    <canvas id="canvas"></canvas>
    <button type="button" class="btn" id="downloadBtn">تحميل الصورة</button>
  </div>

  <script>
    const cameraInput = document.getElementById('cameraInput');
    const galleryInput = document.getElementById('galleryInput');
    const cameraBtn = document.getElementById('cameraBtn');
    const galleryBtn = document.getElementById('galleryBtn');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const downloadBtn = document.getElementById('downloadBtn');

    const frameImg = new Image();
    frameImg.src = './frame.png';

    let userImg = null;

    function draw() {
      if (!frameImg.complete || !frameImg.naturalWidth) return;

      if (canvas.width !== frameImg.naturalWidth || canvas.height !== frameImg.naturalHeight) {
        canvas.width = frameImg.naturalWidth;
        canvas.height = frameImg.naturalHeight;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (userImg) {
        const scale = Math.max(canvas.width / userImg.width, canvas.height / userImg.height);
        const w = userImg.width * scale;
        const h = userImg.height * scale;
        const x = (canvas.width - w) / 2;
        const y = (canvas.height - h) / 2;
        ctx.drawImage(userImg, x, y, w, h);
      }

      ctx.drawImage(frameImg, 0, 0, canvas.width, canvas.height);
    }

    frameImg.onload = draw;

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          userImg = img;
          draw();
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    cameraBtn.addEventListener('click', () => cameraInput.click());
    galleryBtn.addEventListener('click', () => galleryInput.click());
    cameraInput.addEventListener('change', handleFileSelect);
    galleryInput.addEventListener('change', handleFileSelect);

    downloadBtn.addEventListener('click', () => {
      const link = document.createElement('a');
      link.download = 'my-event-photo.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  </script>
</body>
</html>
